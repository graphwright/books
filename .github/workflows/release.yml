name: Build and Release

on:
  push:
    branches:
      - main
      - one-book

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            pandoc \
            texlive-xetex \
            texlive-fonts-recommended \
            texlive-fonts-extra \
            texlive-latex-extra \
            bc \
            python3-yaml

      - name: Build identity-book
        run: make -C identity-book

      - name: Generate mkdocs content
        run: |
          python3 scripts/split_for_mkdocs.py \
            --src identity-book/text.md \
            --out identity-book/docs \
            --mkdocs-yml identity-book/mkdocs.yml

      - name: Create release timestamp
        id: timestamp
        run: echo "ts=$(date -u '+%Y%m%dT%H%M%S')" >> "$GITHUB_OUTPUT"

      - name: Package archive
        env:
          TS: ${{ steps.timestamp.outputs.ts }}
        run: |
          tar -czf identity-book-${TS}.tar.gz \
            identity-book/text.pdf \
            identity-book/text.epub \
            identity-book/docs/ \
            identity-book/mkdocs.yml

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "release-${{ steps.timestamp.outputs.ts }}"
          name: "Release ${{ steps.timestamp.outputs.ts }}"
          body: |
            Automated release built from commit ${{ github.sha }}.

            Contains:
            - Interior PDF (Lulu-ready 6×9)
            - EPUB edition
            - `docs/` + `mkdocs.yml` (mkdocs site content)
          files: identity-book-${{ steps.timestamp.outputs.ts }}.tar.gz
          fail_on_unmatched_files: true
